<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sign-In - Daily Hisab</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 20px;
      border: 1px solid #334155;
      text-align: center;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .btn-google {
      background: #ffffff;
      color: #1f2937;
      font-weight: 600;
      font-size: 15px;
      padding: 14px 24px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-top: 20px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .btn-google:hover {
      background: #f3f4f6;
      transform: translateY(-1px);
    }

    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD1NTo4HenlAFBZZd--LcT4B0gNFQQuXuQ",
      authDomain: "taskmanager-bbf73.firebaseapp.com",
      projectId: "taskmanager-bbf73",
      storageBucket: "taskmanager-bbf73.firebasestorage.app",
      messagingSenderId: "538636186820",
      appId: "1:538636186820:ios:f837052b19818bd3a60591"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.doGoogleSignIn = async function() {
      const btn = document.getElementById('googleBtn');
      const statusDiv = document.getElementById('statusMsg');
      if (btn) btn.disabled = true;
      if (statusDiv) statusDiv.innerHTML = '⏳ Connecting to Google...';

      try {
        const provider = new GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        const result = await signInWithPopup(auth, provider);

        if (result && result.user) {
          const credential = GoogleAuthProvider.credentialFromResult(result);
          const payload = {
            uid: result.user.uid,
            email: result.user.email,
            displayName: result.user.displayName,
            idToken: await result.user.getIdToken(),
            idTokenCred: credential?.idToken || null,
            accessTokenCred: credential?.accessToken || null
          };

          await fetch('/api/auth-callback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });

          document.body.innerHTML = `
            <div class="card">
              <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
              <h2 style="color: #10b981; margin: 0 0 8px 0;">Signed In to Google!</h2>
              <p style="color: #94a3b8; font-size: 14px; margin: 0;">Returning to Daily Hisab Desktop App...</p>
            </div>
          `;
          setTimeout(() => { try { window.close(); } catch (e) { } }, 1200);
        }
      } catch (err) {
        console.error('Google Auth Error:', err);
        if (btn) btn.disabled = false;
        if (statusDiv) statusDiv.innerHTML = `<span style="color: #ef4444;">⚠️ ${err.message || 'Authentication failed. Please try again.'}</span>`;
      }
    };
  </script>
</head>

<body>
  <div class="card">
    <div style="font-size: 44px; margin-bottom: 12px;">🔐</div>
    <h2 style="color: #f8fafc; margin: 0 0 8px 0;">Sign In to Daily Hisab</h2>
    <p style="color: #94a3b8; font-size: 14px; margin: 0 0 16px 0;">Click the button below to authorize with Google</p>

    <button id="googleBtn" class="btn-google" onclick="window.doGoogleSignIn()">
      <svg width="20" height="20" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>
    <div id="statusMsg" style="margin-top: 16px; font-size: 13px; color: #94a3b8;"></div>
  </div>
</body>

</html>
